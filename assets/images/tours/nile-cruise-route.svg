<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc"><title id="title">Eight-day Egypt tour route</title><desc id="desc">An illustrative route from Cairo to Aswan, along the Nile to Luxor, and on to Hurghada.</desc><rect width="680" height="400" fill="#eef7f6"/><path d="M120 30 510 40 600 340 150 365Z" fill="#e8d8b6" opacity=".55"/><path d="M270 60 330 315 345 225 470 170" fill="none" stroke="#2a9f9d" stroke-width="5" stroke-dasharray="8 7"/><g fill="#153b60" font-family="sans-serif" font-size="23" font-weight="600"><circle cx="270" cy="60" r="9"/><text x="288" y="65">Cairo / Giza</text><circle cx="330" cy="315" r="9"/><text x="350" y="323">Aswan</text><circle cx="345" cy="225" r="9"/><text x="365" y="233">Luxor</text><circle cx="470" cy="170" r="9"/><text x="490" y="177">Hurghada</text></g><text x="24" y="376" fill="#455665" font-family="sans-serif" font-size="14">Route overview · illustration, not to scale</text></svg>