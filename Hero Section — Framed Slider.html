<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hero Section — Framed Slider</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.10/swiper-bundle.min.js"></script>
  <style>
    :root {
      --main-color: #082844;
      --main-color-dark: #061d35;
      --color-second: #16507d;
      --color-second-light: #1d689f;
      --accent-color: #c99b3d;
      --accent-color-light: #e3bd68;
      --white-color: #ffffff;
      --color-off-white: #fcfbf8;
      --color-gray-500: #6c7782;
      --shadow-sm: 0 2px 8px rgba(6, 29, 53, .08);
      --shadow-lg: 0 20px 50px rgba(6, 29, 53, .22);
      --font-heading: "Lora", serif;
      --font-body: "Manrope", sans-serif;
      --container: 1240px;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--color-off-white)
    }

    .hero-section {
      padding: 56px 24px
    }

    .hero-wrapper {
      position: relative;
      max-width: var(--container);
      margin: 0 auto;
      height: 520px
    }

    .hero-swiper {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    .hero-swiper .swiper-wrapper {
      align-items: center
    }

    .hero-swiper .swiper-slide {
      width: 78%;
      height: 480px;
      border-radius: 22px;
      overflow: hidden;
      opacity: .6;
      transform: scale(.95);
      transition: opacity .5s, transform .5s
    }

    .hero-swiper .swiper-slide-active {
      opacity: 1;
      transform: scale(1)
    }

    .slide-media {
      width: 100%;
      height: 100%
    }

    .slide-media svg {
      width: 100%;
      height: 100%;
      display: block
    }

    /* ---- Static frame overlay: fixed in place, slides move behind/into it ---- */
    .hero-frame {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 480px;
      border: 2px solid var(--accent-color-light);
      border-radius: 22px;
      box-shadow: 0 0 0 6px var(--white-color), 0 0 0 8px var(--accent-color);
      pointer-events: none;
      z-index: 5
    }

    .hero-frame-tag {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--white-color);
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--main-color);
      box-shadow: var(--shadow-sm)
    }

    /* ---- Static content overlay: same on every slide, not tied to the swiper ---- */
    .hero-content {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 480px;
      z-index: 6;
      border-radius: 22px;
      display: flex;
      align-items: center;
      pointer-events: none;
      background: linear-gradient(105deg, rgba(6, 29, 53, .78) 0%, rgba(6, 29, 53, .35) 48%, rgba(6, 29, 53, 0) 75%)
    }

    .hero-copy {
      max-width: 420px;
      padding: 0 0 0 48px
    }

    .hero-eyebrow {
      display: block;
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 16px;
      color: var(--accent-color-light);
      margin-bottom: 10px
    }

    .hero-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.15;
      color: var(--white-color);
      margin: 0 0 16px
    }

    .hero-title em {
      font-style: italic;
      font-weight: 500
    }

    .hero-desc {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, .85);
      margin: 0 0 28px;
      max-width: 360px
    }

    .hero-cta {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-color);
      color: var(--main-color-dark);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14.5px;
      padding: 14px 24px;
      border-radius: 999px;
      text-decoration: none;
      transition: background .2s
    }

    .hero-cta:hover {
      background: var(--accent-color-light)
    }

    @media (max-width:760px) {
      .hero-wrapper {
        height: 440px
      }

      .hero-swiper .swiper-slide,
      .hero-frame,
      .hero-content {
        width: 88%;
        height: 400px
      }

      .hero-copy {
        padding-left: 28px;
        max-width: 280px
      }
    }
  </style>
</head>

<body>

  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d689f" />
        <stop offset="1" stop-color="#061d35" />
      </linearGradient>
      <linearGradient id="skyBeach" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd8ec" />
        <stop offset="1" stop-color="#eaf7fb" />
      </linearGradient>
      <symbol id="scene-beach" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="url(#skyBeach)" />
        <ellipse cx="330" cy="55" rx="60" ry="18" fill="#ffffff" opacity=".8" />
        <ellipse cx="70" cy="80" rx="50" ry="14" fill="#ffffff" opacity=".7" />
        <rect x="0" y="195" width="400" height="35" fill="#2a9fc7" />
        <path d="M0,225 Q100,215 200,226 T400,222 V300 H0 Z" fill="#f2e2c2" />
        <path d="M0,255 Q120,245 220,256 T400,250 V300 H0 Z" fill="#e6d2a8" />
        <path d="M200,300 C196,230 188,150 206,60" fill="none" stroke="#6b4a2b" stroke-width="8"
          stroke-linecap="round" />
        <g fill="#3f7d43">
          <path d="M206,62 C170,40 130,50 108,80 C150,78 178,70 206,80 Z" />
          <path d="M206,62 C240,36 280,44 305,72 C265,72 236,66 206,80 Z" />
          <path d="M206,60 C186,20 150,6 118,10 C150,32 176,46 206,68 Z" />
          <path d="M206,60 C222,16 258,-2 292,6 C258,26 232,42 206,68 Z" />
          <path d="M206,58 C204,20 196,-8 206,-20 C222,-2 222,30 206,58 Z" />
        </g>
        <g fill="#0d2a3d">
          <ellipse cx="150" cy="222" rx="6" ry="6" />
          <path d="M150,228 q-6,18 -2,34 q10,4 10,-10 q4,14 12,10 q4,-16 -6,-34 Z" />
          <ellipse cx="172" cy="230" rx="6" ry="6" />
          <path d="M172,236 q-4,16 0,30 q8,4 8,-8 q6,12 12,6 q2,-14 -8,-28 Z" />
          <line x1="160" y1="248" x2="170" y2="250" stroke="#0d2a3d" stroke-width="3" />
        </g>
      </symbol>
      <symbol id="scene-felucca" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="url(#skyGrad)" />
        <circle cx="80" cy="60" r="28" fill="#e3bd68" />
        <path d="M0,220 Q100,195 200,220 T400,220 V300 H0 Z" fill="#0d385a" />
        <path d="M0,245 Q100,222 200,245 T400,245 V300 H0 Z" fill="#061d35" />
        <polygon points="150,235 150,140 205,235" fill="#c99b3d" />
        <line x1="150" y1="235" x2="150" y2="130" stroke="#e3bd68" stroke-width="3" />
      </symbol>
      <symbol id="scene-luxor" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="url(#skyGrad)" />
        <circle cx="60" cy="55" r="26" fill="#e3bd68" />
        <rect x="0" y="250" width="400" height="50" fill="#061d35" />
        <g fill="#082844">
          <rect x="40" y="140" width="26" height="110" />
          <rect x="30" y="128" width="46" height="16" />
          <rect x="140" y="120" width="26" height="130" />
          <rect x="130" y="105" width="46" height="18" />
          <rect x="240" y="140" width="26" height="110" />
          <rect x="230" y="128" width="46" height="16" />
          <rect x="330" y="120" width="26" height="130" />
          <rect x="320" y="105" width="46" height="18" />
        </g>
      </symbol>
      <symbol id="scene-desert" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="url(#skyGrad)" />
        <circle cx="320" cy="65" r="30" fill="#e3bd68" />
        <path d="M0,220 Q120,150 250,210 T400,190 V300 H0 Z" fill="#0d385a" />
        <path d="M0,250 Q140,200 260,245 T400,230 V300 H0 Z" fill="#061d35" />
      </symbol>
      <symbol id="scene-pyramids" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="url(#skyGrad)" />
        <circle cx="320" cy="70" r="34" fill="#e3bd68" />
        <rect x="0" y="230" width="400" height="70" fill="#0d385a" />
        <polygon points="70,230 150,120 230,230" fill="#082844" />
        <polygon points="150,230 220,150 290,230" fill="#0d385a" />
        <polygon points="220,230 270,170 320,230" fill="#061d35" />
      </symbol>
    </defs>
  </svg>

  <section class="hero-section">
    <div class="hero-wrapper">
      <div class="swiper hero-swiper" id="heroSwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="slide-media"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                <use href="#scene-beach"></use>
              </svg></div>
          </div>
          <div class="swiper-slide">
            <div class="slide-media"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                <use href="#scene-felucca"></use>
              </svg></div>
          </div>
          <div class="swiper-slide">
            <div class="slide-media"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                <use href="#scene-pyramids"></use>
              </svg></div>
          </div>
          <div class="swiper-slide">
            <div class="slide-media"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                <use href="#scene-luxor"></use>
              </svg></div>
          </div>
          <div class="swiper-slide">
            <div class="slide-media"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
                <use href="#scene-desert"></use>
              </svg></div>
          </div>
        </div>
      </div>

      <!-- Static frame: does not belong to the swiper, never moves -->
      <div class="hero-frame"><span class="hero-frame-tag">Made For Memories</span></div>

      <!-- Static content: identical regardless of which slide is centered -->
      <div class="hero-content">
        <div class="hero-copy">
          <span class="hero-eyebrow">Discover Egypt Without Limits</span>
          <h1 class="hero-title">Escape to <em>Timeless</em> Egypt</h1>
          <p class="hero-desc">Handpicked journeys along the Nile, through the desert, and into 5,000 years of history.
          </p>
          <a href="#" class="hero-cta">Book Now
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 17L17 7M17 7H7M17 7V17" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </section>

  <script>
    new Swiper('#heroSwiper', {
      loop: true,
      centeredSlides: true,
      slidesPerView: 'auto',
      spaceBetween: 12,
      speed: 700,
      autoplay: { delay: 4500, disableOnInteraction: false },
      grabCursor: true
    });
  </script>
</body>

</html>
