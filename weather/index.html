<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Time to Visit – Monthly Climate Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="climate" id="climateWidget" aria-labelledby="climateTitle">
  <div class="climate__inner">

    <header class="climate__head">
      <h2 class="climate__title" id="climateTitle">When is the best time to visit?</h2>
      <p class="climate__lead">Pick a destination to see how each month feels, based on real 2025 weather records.</p>
    </header>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <label class="search__field" for="cityInput">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Destination city</span>
        <input type="text" id="cityInput" name="city" placeholder="Search a city, e.g. Aswan" required>
      </label>
      <button type="submit" class="search__btn" id="searchBtn">Check Best Months</button>
    </form>

    <div class="presets" role="group" aria-label="Popular destinations">
      <button type="button" class="preset" data-city="Luxor">Luxor</button>
      <button type="button" class="preset" data-city="Sharm El Sheikh">Sharm El Sheikh</button>
      <button type="button" class="preset" data-city="Cairo">Cairo</button>
      <button type="button" class="preset" data-city="Alexandria">Alexandria</button>
    </div>

    <div class="result-head" id="resultHead" hidden>
      <h3 class="result-head__place" id="placeName"></h3>
      <p class="result-head__best" id="bestSummary"></p>
    </div>

    <p class="message" id="message" role="status" aria-live="polite" hidden></p>

    <ul class="grid" id="monthGrid" aria-live="polite"></ul>

    <ul class="legend" aria-label="Colour key">
      <li><span class="dot dot--ideal"></span>Best time</li>
      <li><span class="dot dot--moderate"></span>Acceptable</li>
      <li><span class="dot dot--hot"></span>Too hot</li>
      <li><span class="dot dot--cold"></span>Too cold or wet</li>
    </ul>

  </div>
</section>

<script src="app.js"></script>
</body>
</html>
